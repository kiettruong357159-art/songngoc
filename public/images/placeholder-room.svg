<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f5f0e8" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c49a45" />
      <stop offset="100%" stop-color="#b08736" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5b66" />
      <stop offset="100%" stop-color="#0a434b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#ede7df" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Boutique Window / Arch -->
  <path d="M 300 240 A 100 100 0 0 1 500 240 L 500 360 L 300 360 Z" fill="#eaf4f6" opacity="0.8" />
  <circle cx="430" cy="210" r="28" fill="url(#goldGradient)" opacity="0.6" />

  <!-- Room Bed & Headboard Silhouette -->
  <path d="M 280 410 L 520 410 C 530 410 538 402 538 392 L 538 340 C 538 330 530 322 520 322 L 280 322 C 270 322 262 330 262 340 L 262 392 C 262 402 270 410 280 410 Z" fill="#ffffff" stroke="#ede7df" stroke-width="2" />
  <rect x="300" y="340" width="80" height="40" rx="8" fill="#eaf4f6" />
  <rect x="420" y="340" width="80" height="40" rx="8" fill="#eaf4f6" />
  <path d="M 250 410 L 550 410 L 560 450 L 240 450 Z" fill="url(#tealGradient)" opacity="0.9" />

  <!-- Nightstand Lamps -->
  <path d="M 210 370 L 230 370 L 225 350 L 215 350 Z" fill="url(#goldGradient)" />
  <line x1="220" y1="370" x2="220" y2="420" stroke="#c49a45" stroke-width="3" />
  <path d="M 570 370 L 590 370 L 585 350 L 575 350 Z" fill="url(#goldGradient)" />
  <line x1="580" y1="370" x2="580" y2="420" stroke="#c49a45" stroke-width="3" />

  <!-- Brand Typography -->
  <text x="400" y="495" font-family="'Cinzel', 'Playfair Display', serif, Georgia" font-size="20" font-weight="700" fill="#0f5b66" text-anchor="middle" letter-spacing="3">SONG NGỌC HOMESTAY</text>
  <text x="400" y="525" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="#c49a45" text-anchor="middle" letter-spacing="1.5">HÌNH ẢNH ĐANG ĐƯỢC CẬP NHẬT</text>
</svg>
