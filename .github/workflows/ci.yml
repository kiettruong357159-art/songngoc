name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci?sslmode=disable
      SESSION_SECRET: ci_session_secret_at_least_32_characters_long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: "[Gateway 1/4] Code rules"
        run: npm run check:rules
      - name: "[Gateway 2/4] Type check"
        run: npm run check:types
      - name: "[Gateway 3/4] Test"
        run: npm test
      - name: "[Gateway 4/4] Build"
        run: npm run build
