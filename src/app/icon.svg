<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5b66" />
      <stop offset="100%" stop-color="#072d33" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#c49a45" />
      <stop offset="100%" stop-color="#9a7428" />
    </linearGradient>

    <!-- Pearl 1 Gradient -->
    <radialGradient id="pearl1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2f1" />
      <stop offset="85%" stop-color="#80cbc4" />
      <stop offset="100%" stop-color="#00695c" />
    </radialGradient>

    <!-- Pearl 2 Gradient (Golden Opal) -->
    <radialGradient id="pearl2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef9c3" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Wave Ring Motif (Phan Thiết Sea & Unity) -->
  <path d="M16 38 C 20 28, 28 22, 38 22 C 48 22, 52 30, 48 40 C 44 48, 32 50, 22 46 C 17 44, 14 39, 16 38 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Pearl 1 (Teal Pearl - Ngọc Biển) -->
  <circle cx="27" cy="35" r="9" fill="url(#pearl1)" filter="url(#glow)" />
  <ellipse cx="24.5" cy="32" rx="3" ry="1.8" fill="#ffffff" opacity="0.8" transform="rotate(-30 24.5 32)" />

  <!-- Pearl 2 (Golden Pearl - Ngọc Vàng) -->
  <circle cx="39" cy="27" r="7.5" fill="url(#pearl2)" filter="url(#glow)" />
  <ellipse cx="37" cy="24.5" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85" transform="rotate(-30 37 24.5)" />

  <!-- Sparkle Star (Ánh Sáng Ngọc) -->
  <path d="M43 14 Q 44.5 17.5 48 19 Q 44.5 20.5 43 24 Q 41.5 20.5 38 19 Q 41.5 17.5 43 14 Z"
        fill="url(#goldGrad)" />
</svg>
