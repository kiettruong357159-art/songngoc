<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5b66" />
      <stop offset="100%" stop-color="#072d33" />
    </linearGradient>

    <linearGradient id="appleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#c49a45" />
      <stop offset="100%" stop-color="#9a7428" />
    </linearGradient>

    <radialGradient id="applePearl1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2f1" />
      <stop offset="85%" stop-color="#80cbc4" />
      <stop offset="100%" stop-color="#00695c" />
    </radialGradient>

    <radialGradient id="applePearl2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef9c3" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
  </defs>

  <rect width="180" height="180" rx="42" fill="url(#appleBg)" />
  <rect x="3" y="3" width="174" height="174" rx="39" fill="none" stroke="url(#appleGold)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Wave Ring Motif -->
  <path d="M45 108 C 56 80, 78 62, 108 62 C 136 62, 148 84, 136 112 C 124 134, 90 140, 62 130 C 48 124, 40 112, 45 108 Z"
        fill="none" stroke="url(#appleGold)" stroke-width="7" stroke-linecap="round" opacity="0.85" />

  <!-- Pearl 1 -->
  <circle cx="76" cy="100" r="26" fill="url(#applePearl1)" />
  <ellipse cx="69" cy="91" rx="8" ry="5" fill="#ffffff" opacity="0.8" transform="rotate(-30 69 91)" />

  <!-- Pearl 2 -->
  <circle cx="110" cy="78" r="21" fill="url(#applePearl2)" />
  <ellipse cx="104" cy="71" rx="6.5" ry="4" fill="#ffffff" opacity="0.85" transform="rotate(-30 104 71)" />

  <!-- Sparkle Star -->
  <path d="M122 40 Q 126 50 136 54 Q 126 58 122 68 Q 118 58 108 54 Q 118 50 122 40 Z"
        fill="url(#appleGold)" />
</svg>
